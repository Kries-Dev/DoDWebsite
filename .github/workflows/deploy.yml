name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild: picks up new build orders pushed to Kries-Dev/BuildOrders,
  # and keeps "upcoming" vs "past" events current without a commit.
  schedule:
    - cron: '17 4 * * *'
  # Lets the BuildOrders repo trigger a rebuild right after a push (see README).
  repository_dispatch:
    types: [build-orders-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the build-order library
        uses: actions/checkout@v4
        with:
          repository: Kries-Dev/BuildOrders
          path: vendor/BuildOrders
          sparse-checkout: |
            Build Orders
            assets
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/sync-build-orders.mjs vendor/BuildOrders
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
